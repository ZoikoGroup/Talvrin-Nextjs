name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-talvrin-website
  cancel-in-progress: false

env:
  VM_HOST: 35.255.235.201
  VM_USER: lennox
  APP_DIR: /var/www/talvrin-website/app

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.GCP_SSH_KEY }}
        run: |
          [ -n "$SSH_KEY" ] || { echo "::error::GCP_SSH_KEY secret is empty in this repo"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -lf ~/.ssh/deploy_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONF
          Host vm
            HostName $VM_HOST
            User $VM_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          CONF
          chmod 600 ~/.ssh/config

      - name: Upload build to VM
        run: |
          ssh vm "rm -rf $APP_DIR/.next.incoming && mkdir -p $APP_DIR/.next.incoming"
          tar -czf - --exclude='.next/cache' .next | ssh vm "tar -xzf - -C $APP_DIR/.next.incoming --strip-components=1"

      - name: Activate release on VM
        run: |
          ssh vm bash -s -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          SHA="$1"
          cd /var/www/talvrin-website/app

          git fetch origin main
          git reset --hard "$SHA"

          NEW_HASH=$(sha256sum package-lock.json | cut -d' ' -f1)
          OLD_HASH=$(cat .deps-hash 2>/dev/null || true)
          if [ "$NEW_HASH" != "$OLD_HASH" ] || [ ! -d node_modules ]; then
            npm ci
            echo "$NEW_HASH" > .deps-hash
          fi

          rm -rf .next.old
          if [ -d .next ]; then mv .next .next.old; fi
          mv .next.incoming .next
          pm2 restart talvrin-website
          sleep 6

          CHUNK=$(curl -s http://127.0.0.1:3000 | grep -o '/_next/static/[^"]*\.js' | head -1 || true)
          CODE=000
          if [ -n "$CHUNK" ]; then
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$CHUNK" || true)
          fi

          if [ "$CODE" != "200" ]; then
            echo "Health check failed (chunk='$CHUNK', status=$CODE). Rolling back."
            rm -rf .next
            if [ -d .next.old ]; then mv .next.old .next; fi
            pm2 restart talvrin-website
            exit 1
          fi

          pm2 save
          echo "Deploy OK: $CHUNK returned 200"
          REMOTE
