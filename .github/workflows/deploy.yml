name: Deploy Talvrin Website

concurrency:
  group: deploy-talvrin-website
  cancel-in-progress: false

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_SSH_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            set -e
            cd /var/www/talvrin-website/app
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run build
            pm2 restart talvrin-website
            pm2 save
